<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Player Pro - Online Room</title>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.0.js"></script>

    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #2ecc71;
            --danger: #e74c3c; --light: #ecf0f1; --dark: #1a252f;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--dark); color: var(--light); margin: 0; padding: 10px; }
        
        /* Lobby Overlay */
        #lobby-screen {
            position: fixed; inset: 0; background: var(--dark); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        /* Voice Bar */
        .voice-controls {
            background: #243342; padding: 10px; border-radius: 8px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #34495e;
        }

        /* EXACT OFFLINE STYLES INTEGRATED */
        .teams-banner { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; background: #2c3e50; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #34495e; text-align: center; }
        .team-name-display { color: #5dade2; font-weight: bold; }
        .round-table-arena { 
            position: relative; width: 100%; max-width: 600px; height: 500px; 
            background: #1e2b37; border: 4px solid #34495e; border-radius: 50%; 
            margin: 20px auto; display: grid; 
            grid-template-areas: ". playerA ." "playerD tableCenter playerB" ". playerC .";
            grid-template-rows: 140px 1fr 140px; grid-template-columns: 130px 1fr 130px;
            align-items: center; justify-items: center;
        }
        .player-spot { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .player-label { font-weight: bold; padding: 4px 10px; border-radius: 12px; background: #2c3e50; font-size: 13px; margin-bottom: 6px; border: 1px solid #455a64; }
        .active .player-label { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        
        .card { background: white; color: black; border-radius: 4px; padding: 5px 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin: 2px; }
        .card.red { color: var(--danger); }
        .card.hidden { background: #34495e; color: transparent; border: 1px solid #1a252f; cursor: default; }

        .table-center { grid-area: tableCenter; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .played-card-box { background: white; color: black; width: 45px; height: 65px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; position: relative; }
        
        .side-panel { background: #243342; border-radius: 12px; padding: 15px; border: 1px solid #34495e; margin-top: 20px; }
        .log-list { height: 150px; overflow-y: auto; background: #1a252f; padding: 10px; border-radius: 6px; font-size: 12px; list-style: none; margin: 0; display: flex; flex-direction: column-reverse; }

        .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 2px; }
        .btn-danger { background: var(--danger); }
    </style>
</head>
<body>

<div id="lobby-screen">
    <h1 id="lobby-title">Card Game Lobby</h1>
    <div id="lobby-setup">
        <button class="btn" onclick="initRoom()">Create Game Room</button>
    </div>
    <div id="lobby-wait" style="display:none;">
        <p>Send this link to exactly 3 other players:</p>
        <input type="text" id="share-link" readonly style="width:80%; padding:10px; background:#2c3e50; color:white; border:none; text-align:center;">
        <div id="connected-list" style="margin-top:20px;"></div>
        <p id="wait-msg">Waiting for 4 players...</p>
        <button id="start-broadcast" class="btn" style="display:none; background:var(--success);" onclick="triggerGameStart()">Start Match</button>
    </div>
</div>

<div class="container">
    <div class="voice-controls">
        <div>Role: <b id="my-role-display">Joining...</b></div>
        <button class="btn" id="voice-btn" onclick="toggleMute()">Mute Voice</button>
    </div>

    <div class="teams-banner">
        <div><span class="team-name-display">TEAM 1 (A+C)</span><br>Tricks: <b id="t1-score">0</b></div>
        <div id="match-target" style="background:#1a252f; padding:8px; border-radius:5px; font-size:12px;">Target: -</div>
        <div><span class="team-name-display" style="color:#f5b041">TEAM 2 (B+D)</span><br>Tricks: <b id="t2-score">0</b></div>
    </div>

    <div id="status-message" style="background:#2c3e50; padding:10px; border-radius:5px; text-align:center; margin-bottom:10px; font-weight:bold;">Initializing...</div>
    
    <div id="action-area" style="text-align:center; min-height:50px;"></div>

    <div class="round-table-arena">
        <div class="player-spot" id="spot-A"><div class="player-label">Player A</div><div id="cards-A"></div></div>
        <div class="player-spot" id="spot-B"><div class="player-label">Player B</div><div id="cards-B"></div></div>
        <div class="player-spot" id="spot-C"><div class="player-label">Player C</div><div id="cards-C"></div></div>
        <div class="player-spot" id="spot-D"><div class="player-label">Player D</div><div id="cards-D"></div></div>
        <div class="table-center" id="table-pit"></div>
    </div>

    <div class="side-panel">
        <div style="display:flex; justify-content: space-between;">
            <span>Trump: <b id="info-trump">Locked 🔒</b></span>
            <span>Turn: <b id="info-turn">-</b></span>
        </div>
        <hr style="border:0; border-top:1fr solid #34495e; margin:10px 0;">
        <ul class="log-list" id="game-log"></ul>
    </div>
</div>

<script>
/* --- CONFIG --- */
const SUPABASE_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
const SUPABASE_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";
const AGORA_APP_ID = "YOUR_APP_ID"; // IMPORTANT: Add your Agora ID for voice
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

let roomID = new URLSearchParams(window.location.search).get('room');
let myRole = ''; 
let channel = null;
let micTrack = null;

let state = {
    phase: 'LOBBY',
    turn: 'A',
    oppIdx: 0,
    hands: { A:[], B:[], C:[], D:[] },
    pit: [],
    tricksWon: { T1:0, T2:0 },
    trumpSuit: null,
    trumpRevealed: false,
    finalBidder: null,
    bidTarget: 0,
    bidCount: 0,
    logs: []
};

/* --- NETWORKING --- */
async function initRoom() {
    if(!roomID) {
        roomID = Math.random().toString(36).substring(2, 8);
        window.history.pushState({}, '', `?room=${roomID}`);
    }
    document.getElementById('lobby-setup').style.display = 'none';
    document.getElementById('lobby-wait').style.display = 'block';
    document.getElementById('share-link').value = window.location.href;

    channel = client.channel(`game_${roomID}`, { config: { presence: { key: roomID } } });

    channel
    .on('presence', { event: 'sync' }, () => {
        const presence = channel.presenceState();
        const players = Object.values(presence).flat();
        updateLobbyList(players);
    })
    .on('broadcast', { event: 'state-sync' }, ({ payload }) => {
        state = payload;
        render();
    })
    .on('broadcast', { event: 'start-game' }, () => {
        document.getElementById('lobby-screen').style.display = 'none';
        startVoice();
    })
    .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
            const p = channel.presenceState();
            const count = Object.keys(p).length;
            myRole = ['A', 'B', 'C', 'D'][count] || 'Viewer';
            document.getElementById('my-role-display').innerText = `Player ${myRole}`;
            await channel.track({ role: myRole });
        }
    });
}

function updateLobbyList(players) {
    const list = document.getElementById('connected-list');
    list.innerHTML = players.map(p => `<div>✅ Player ${p.role} Joined</div>`).join('');
    if(players.length >= 4 && myRole === 'A') {
        document.getElementById('start-broadcast').style.display = 'block';
        document.getElementById('wait-msg').innerText = "Ready to Play!";
    }
}

/* --- GAME LOGIC --- */
function triggerGameStart() {
    // Exact Rules: Shuffle and deal 4 cards each for Bidding
    const deck = [];
    ['S','C','H','D'].forEach(s => ['7','8','9','10','J','Q','K','A'].forEach(v => deck.push({suit:s, val:v})));
    for(let i=deck.length-1; i>0; i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i], deck[j]]=[deck[j], deck[i]]; }

    state = {
        ...state,
        phase: 'BID1',
        turn: 'A',
        hands: {
            A: deck.slice(0, 4), B: deck.slice(4, 8),
            C: deck.slice(8, 12), D: deck.slice(12, 16)
        },
        fullDeck: deck, // Store the rest to deal after bid
        logs: ["Match Started: Bidding on 4 cards."]
    };
    channel.send({ type: 'broadcast', event: 'start-game', payload: {} });
    sync();
}

function sync() {
    channel.send({ type: 'broadcast', event: 'state-sync', payload: state });
    render();
}

function render() {
    document.getElementById('t1-score').innerText = state.tricksWon.T1;
    document.getElementById('t2-score').innerText = state.tricksWon.T2;
    document.getElementById('status-message').innerText = `${state.phase} - Turn: Player ${state.turn}`;
    document.getElementById('info-turn').innerText = `Player ${state.turn}`;
    document.getElementById('info-trump').innerHTML = state.trumpRevealed ? state.trumpSuit : "Locked 🔒";
    
    // Logs
    const logEl = document.getElementById('game-log');
    logEl.innerHTML = state.logs.map(l => `<li>${l}</li>`).join('');

    // Actions
    const actionEl = document.getElementById('action-area');
    actionEl.innerHTML = '';
    if(state.turn === myRole) {
        if(state.phase === 'BID1') {
            actionEl.innerHTML = `<button class="btn" onclick="handleBid(5)">Bid 5</button>
                                  <button class="btn" onclick="handleBid(6)">Bid 6</button>
                                  <button class="btn btn-danger" onclick="handleBid(0)">Pass</button>`;
        } else if(state.phase === 'SELECT_TRUMP') {
            ['♠','♣','♥','♦'].forEach(s => {
                actionEl.innerHTML += `<button class="btn" onclick="setTrump('${s}')">${s}</button>`;
            });
        }
    }

    // Render Hands (Hide others)
    ['A','B','C','D'].forEach(p => {
        const spot = document.getElementById(`spot-${p}`);
        spot.classList.toggle('active', state.turn === p);
        const row = document.getElementById(`cards-${p}`);
        row.innerHTML = state.hands[p].map((c, i) => {
            if(p === myRole) {
                const isRed = c.suit === 'H' || c.suit === 'D';
                const sChar = {S:'♠', C:'♣', H:'♥', D:'♦'}[c.suit];
                return `<button class="card ${isRed?'red':''}" onclick="playCard(${i})">${c.val}${sChar}</button>`;
            }
            return `<div class="card hidden">?</div>`;
        }).join('');
    });

    // Render Pit
    document.getElementById('table-pit').innerHTML = state.pit.map(p => `
        <div class="played-card-box">
            ${p.card.val}${ {S:'♠',C:'♣',H:'♥',D:'♦'}[p.card.suit] }
            <small style="position:absolute; bottom:-15px; color:white;">${p.player}</small>
        </div>
    `).join('');
}

function handleBid(val) {
    state.logs.push(`Player ${myRole} bids ${val || 'Pass'}`);
    state.bidCount++;
    if(val > state.bidTarget) {
        state.bidTarget = val;
        state.finalBidder = myRole;
    }

    if(state.bidCount === 4) {
        state.phase = 'SELECT_TRUMP';
        state.turn = state.finalBidder || 'A';
    } else {
        state.turn = ['A','B','C','D'][(['A','B','C','D'].indexOf(myRole)+1)%4];
    }
    sync();
}

function setTrump(suit) {
    state.trumpSuit = suit;
    state.phase = 'PLAY';
    state.turn = 'A';
    state.logs.push(`Trump is set secretly. Dealing remaining cards.`);
    
    // Deal remaining 4 cards
    ['A','B','C','D'].forEach((p, i) => {
        state.hands[p] = state.hands[p].concat(state.fullDeck.slice(16 + (i*4), 20 + (i*4)));
    });
    sync();
}

function playCard(idx) {
    if(state.phase !== 'PLAY' || state.turn !== myRole) return;
    const card = state.hands[myRole].splice(idx, 1)[0];
    state.pit.push({ player: myRole, card: card });
    state.turn = ['A','B','C','D'][(['A','B','C','D'].indexOf(myRole)+1)%4];
    
    if(state.pit.length === 4) {
        setTimeout(resolveTrick, 1000);
    }
    sync();
}

function resolveTrick() {
    // Basic logic for demo - wins based on first card suit
    const winner = state.pit[0].player; 
    if(winner === 'A' || winner === 'C') state.tricksWon.T1++;
    else state.tricksWon.T2++;
    
    state.logs.push(`Trick won by ${winner}`);
    state.pit = [];
    state.turn = winner;
    sync();
}

/* --- VOICE --- */
async function startVoice() {
    try {
        await agoraClient.join(AGORA_APP_ID, roomID, null, null);
        micTrack = await AgoraRTC.createMicrophoneAudioTrack();
        await agoraClient.publish([micTrack]);
        agoraClient.on("user-published", async (user, type) => {
            await agoraClient.subscribe(user, type);
            if(type === 'audio') user.audioTrack.play();
        });
    } catch(e) { console.log("Voice blocked"); }
}

function toggleMute() {
    if(!micTrack) return;
    const isMuted = micTrack.enabled;
    micTrack.setEnabled(!isMuted);
    document.getElementById('voice-btn').innerText = isMuted ? "Unmute Voice" : "Mute Voice";
}

if(roomID) initRoom();
</script>

</body>
</html>
