<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Player Team Card Game</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#1a252f;
    --panel:#34495e;
    --yellow:#f1c40f;
    --green:#2ecc71;
    --blue:#3498db;
    --red:#e74c3c;
}

body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

#setup{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
    z-index:100;
}

.btn{
    padding:14px 22px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

.green{background:var(--green);}
.blue{background:var(--blue);}
.red{background:var(--red);}

#roomLink{
    width:320px;
    max-width:90%;
    padding:10px;
    border-radius:8px;
    border:none;
    text-align:center;
}

#main{
    max-width:1000px;
    margin:auto;
    padding:10px;
}

.panel{
    background:var(--panel);
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

#status{
    text-align:center;
    color:var(--yellow);
    font-weight:bold;
}

.score{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
}

#table{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.slotBox{
    background:#2c3e50;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.slot{
    width:90px;
    height:130px;
    margin:auto;
    border:2px dashed rgba(255,255,255,.4);
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:85px;
    height:125px;
    background:white;
    color:black;
    border-radius:10px;
    padding:8px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.redCard{color:#e74c3c;}
.blackCard{color:#2c3e50;}

.hand{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
}

.disabled{
    opacity:.35;
    pointer-events:none;
}

#trump{
    background:var(--yellow);
    color:black;
    padding:5px 15px;
    border-radius:20px;
}

.modal{
    display:none;
    background:#2c3e50;
    border:2px solid var(--yellow);
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    text-align:center;
}

.suitBtn{
    font-size:26px;
    padding:14px 20px;
    margin:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="setup">
    <h1>4 Player Team Card Game</h1>

    <button id="createRoom" class="btn green">
        Create Room
    </button>

    <div id="shareBox" style="display:none;">
        <input type="text" id="roomLink" readonly><br><br>
        <button id="copyBtn" class="btn blue">
            Copy Link
        </button>
    </div>
</div>

<div id="main">

<div class="panel">
    <div class="score">
        <div>TEAM A (1 & 3): <span id="scoreA">0</span></div>

        <div id="trumpBox" style="visibility:hidden;">
            <span id="trump">Trump: ?</span>
        </div>

        <div>TEAM B (2 & 4): <span id="scoreB">0</span></div>
    </div>

    <hr>

    <div id="status">Waiting...</div>
</div>

<div class="modal" id="trumpModal">
    <h3>Select Trump Suit</h3>

    <button class="suitBtn" onclick="chooseTrump('♠')">♠</button>
    <button class="suitBtn" onclick="chooseTrump('♣')">♣</button>
    <button class="suitBtn" style="color:red;" onclick="chooseTrump('♥')">♥</button>
    <button class="suitBtn" style="color:red;" onclick="chooseTrump('♦')">♦</button>
</div>

<div id="table">

<div class="slotBox">
    <h3>Player 2</h3>
    <div class="slot" id="P2slot"></div>
</div>

<div class="slotBox">
    <h3>Player 3</h3>
    <div class="slot" id="P3slot"></div>
</div>

<div class="slotBox">
    <h3>Player 1</h3>
    <div class="slot" id="P1slot"></div>
</div>

<div class="slotBox">
    <h3>Player 4</h3>
    <div class="slot" id="P4slot"></div>
</div>

</div>

<div class="panel">
    <h3>Your Cards</h3>
    <div class="hand" id="myHand"></div>
</div>

</div>

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =========================
GAME STATE
========================= */

const suits = ['♠','♣','♥','♦'];
const values = ['7','8','9','10','J','Q','K','A'];

const power = {
    '7':7,
    '8':8,
    '9':9,
    '10':10,
    'J':11,
    'Q':12,
    'K':13,
    'A':14
};

let roomID = new URLSearchParams(location.search).get("room");

let myPlayer = null;
let channel = null;

let myHand = [];
let trumpSuit = null;

let scores = {
    A:0,
    B:0
};

let currentTurn = "P1";

let tableCards = {
    P1:null,
    P2:null,
    P3:null,
    P4:null
};

let deckCache = [];

const playerOrder = ['P1','P2','P3','P4'];

/* =========================
STARTUP
========================= */

window.onload = ()=>{

    if(roomID){

        joinGame();

    }else{

        document.getElementById("createRoom")
        .onclick=createRoom;
    }

    document.getElementById("copyBtn")
    .onclick=copyLink;
};

function createRoom(){

    roomID=Math.random().toString(36).substring(2,8);

    myPlayer="P1";

    let link=
    location.origin+
    location.pathname+
    "?room="+roomID;

    document.getElementById("roomLink").value=link;

    document.getElementById("shareBox")
    .style.display="block";

    connectRealtime();
}

function copyLink(){

    let input=document.getElementById("roomLink");

    input.select();

    navigator.clipboard.writeText(input.value);

    alert("Copied");
}

function joinGame(){

    const joinIndex =
    parseInt(new URLSearchParams(location.search).get("p")) || 2;

    myPlayer="P"+joinIndex;

    connectRealtime();
}

/* =========================
REALTIME
========================= */

function connectRealtime(){

    channel = client.channel("room-"+roomID);

    channel
    .on(
        'broadcast',
        {event:'deal'},
        ({payload})=>{

            myHand = payload[myPlayer];

            trumpSuit = payload.trump;

            deckCache = payload.deck;

            document.getElementById("setup")
            .style.display="none";

            document.getElementById("trumpBox")
            .style.visibility="visible";

            document.getElementById("trump")
            .innerText="Trump: "+trumpSuit;

            renderHand();

            updateStatus(
                currentTurn===myPlayer
                ? "Your Turn"
                : "Waiting..."
            );
        }
    )

    .on(
        'broadcast',
        {event:'play'},
        ({payload})=>{

            tableCards[payload.player]=payload.card;

            renderTable();

            nextTurn();

            if(allPlayed()){
                setTimeout(checkWinner,1200);
            }
        }
    )

    .subscribe((status)=>{

        if(status==="SUBSCRIBED"){

            document.getElementById("status")
            .innerText="Connected";

            document.getElementById("setup")
            .style.display="none";

            if(myPlayer==="P1"){
                startGame();
            }
        }
    });
}

/* =========================
START GAME
========================= */

function startGame(){

    let deck=[];

    suits.forEach(s=>{
        values.forEach(v=>{
            deck.push({
                value:v,
                suit:s,
                color:
                (s==='♥'||s==='♦')
                ? 'redCard'
                : 'blackCard'
            });
        });
    });

    deck.sort(()=>Math.random()-0.5);

    let hands={
        P1:deck.splice(0,8),
        P2:deck.splice(0,8),
        P3:deck.splice(0,8),
        P4:deck.splice(0,8)
    };

    let trump=
    suits[Math.floor(Math.random()*4)];

    channel.send({
        type:'broadcast',
        event:'deal',
        payload:{
            ...hands,
            trump:trump,
            deck:deck
        }
    });

    myHand=hands.P1;
    trumpSuit=trump;

    document.getElementById("trumpBox")
    .style.visibility="visible";

    document.getElementById("trump")
    .innerText="Trump: "+trump;

    renderHand();
}

/* =========================
PLAY CARD
========================= */

function playCard(index){

    if(currentTurn!==myPlayer){
        return;
    }

    let card=myHand[index];

    myHand.splice(index,1);

    tableCards[myPlayer]=card;

    renderHand();

    renderTable();

    channel.send({
        type:'broadcast',
        event:'play',
        payload:{
            player:myPlayer,
            card:card
        }
    });
}

function nextTurn(){

    let idx=
    playerOrder.indexOf(currentTurn);

    idx=(idx+1)%4;

    currentTurn=playerOrder[idx];

    updateStatus(
        currentTurn===myPlayer
        ? "Your Turn"
        : "Waiting..."
    );

    renderHand();
}

function allPlayed(){

    return (
        tableCards.P1 &&
        tableCards.P2 &&
        tableCards.P3 &&
        tableCards.P4
    );
}

/* =========================
TRICK WINNER
========================= */

function checkWinner(){

    let leadSuit=
    tableCards.P1.suit;

    let winner='P1';

    playerOrder.forEach(player=>{

        let c=tableCards[player];
        let w=tableCards[winner];

        if(
            c.suit===w.suit &&
            power[c.value]>power[w.value]
        ){
            winner=player;
        }

        else if(
            c.suit===trumpSuit &&
            w.suit!==trumpSuit
        ){
            winner=player;
        }

    });

    if(winner==="P1" || winner==="P3"){
        scores.A++;
    }else{
        scores.B++;
    }

    document.getElementById("scoreA")
    .innerText=scores.A;

    document.getElementById("scoreB")
    .innerText=scores.B;

    tableCards={
        P1:null,
        P2:null,
        P3:null,
        P4:null
    };

    renderTable();

    currentTurn=winner;

    updateStatus(
        currentTurn===myPlayer
        ? "You Lead Next"
        : winner+" Leads"
    );

    if(myHand.length===0){

        let result="";

        if(scores.A>scores.B){
            result="TEAM A WINS";
        }else if(scores.B>scores.A){
            result="TEAM B WINS";
        }else{
            result="DRAW";
        }

        alert(result);

        updateStatus(result);
    }
}

/* =========================
UI
========================= */

function renderHand(){

    let hand=document.getElementById("myHand");

    hand.innerHTML="";

    myHand.forEach((card,index)=>{

        let div=document.createElement("div");

        div.className=
        "card "+card.color;

        if(currentTurn!==myPlayer){
            div.classList.add("disabled");
        }

        div.innerHTML=`
        <div>${card.value}</div>
        <div style="font-size:28px;text-align:center;">
            ${card.suit}
        </div>
        <div style="transform:rotate(180deg)">
            ${card.value}
        </div>
        `;

        div.onclick=()=>playCard(index);

        hand.appendChild(div);
    });
}

function renderTable(){

    ['P1','P2','P3','P4']
    .forEach(player=>{

        let slot=
        document.getElementById(player+'slot');

        slot.innerHTML='';

        let card=tableCards[player];

        if(card){

            let div=document.createElement("div");

            div.className=
            "card "+card.color;

            div.innerHTML=`
            <div>${card.value}</div>
            <div style="font-size:28px;text-align:center;">
                ${card.suit}
            </div>
            <div style="transform:rotate(180deg)">
                ${card.value}
            </div>
            `;

            slot.appendChild(div);
        }
    });
}

function updateStatus(msg){
    document.getElementById("status")
    .innerText=msg;
}

/* =========================
TRUMP
========================= */

function chooseTrump(suit){
    trumpSuit=suit;
}

</script>

</body>
</html>
