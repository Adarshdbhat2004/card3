<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Player Card Connect</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a252f; color: white; font-family: sans-serif; text-align: center; }
        #table { 
            display: grid; grid-template-areas: ". P3 ." "P2 . P4" ". P1 .";
            width: 300px; height: 300px; margin: 50px auto; gap: 10px;
        }
        .slot { border: 2px dashed #555; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(0,0,0,0.2); }
        .card { width: 60px; height: 90px; background: white; color: black; border-radius: 5px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .btn { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>Room: <span id="room-id-display">...</span></h1>
        <p id="status">Waiting for players...</p>
        <button id="join-btn" class="btn" onclick="joinGame()">Join as Player <span id="next-p">?</span></button>
        <p>Share this link: <br> <small id="share-link"></small></p>
    </div>

    <div id="game-ui" class="hidden">
        <h2 id="role-display">You are Player X</h2>
        <div id="table">
            <div class="slot" style="grid-area: P3" id="slot-P3">P3</div>
            <div class="slot" style="grid-area: P2" id="slot-P2">P2</div>
            <div class="slot" style="grid-area: P4" id="slot-P4">P4</div>
            <div class="slot" style="grid-area: P1" id="slot-P1">P1</div>
        </div>
        <button class="btn" onclick="playTestCard()">Throw Random Card</button>
    </div>

<script>
    const S_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
    const S_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";
    const supabase = window.supabase.createClient(S_URL, S_KEY);

    let roomID = new URLSearchParams(window.location.search).get('room');
    if (!roomID) {
        roomID = Math.random().toString(36).substring(7).toUpperCase();
        window.history.pushState({}, '', `?room=${roomID}`);
    }

    document.getElementById('room-id-display').innerText = roomID;
    document.getElementById('share-link').innerText = window.location.href;

    let myRole = '';
    let channel = supabase.channel(`room_${roomID}`, { config: { presence: { key: 'user' } } });

    channel
    .on('presence', { event: 'sync' }, () => {
        const state = channel.presenceState();
        const players = Object.values(state).flat();
        document.getElementById('next-p').innerText = players.length + 1;
        document.getElementById('status').innerText = `Players: ${players.length} / 4`;
        
        if (players.length >= 4) {
            document.getElementById('status').innerText = "Room Full! Ready to play.";
        }
    })
    .on('broadcast', { event: 'play' }, (payload) => {
        renderCardOnTable(payload.payload.role, payload.payload.card);
    })
    .subscribe();

    async function joinGame() {
        const state = channel.presenceState();
        const count = Object.values(state).flat().length;
        
        if (count >= 4) return alert("Room full!");
        
        myRole = `P${count + 1}`;
        await channel.track({ role: myRole });

        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        document.getElementById('role-display').innerText = `You are ${myRole}`;
    }

    function playTestCard() {
        const suits = ['♠','♣','♥','♦'];
        const val = ['A','K','Q','J','10'][Math.floor(Math.random()*5)];
        const suit = suits[Math.floor(Math.random()*4)];
        const card = { val, suit };

        // Send to everyone else
        channel.send({
            type: 'broadcast',
            event: 'play',
            payload: { role: myRole, card: card }
        });

        // Show on my screen
        renderCardOnTable(myRole, card);
    }

    function renderCardOnTable(role, card) {
        const slot = document.getElementById(`slot-${role}`);
        slot.innerHTML = `<div class="card">${card.val}${card.suit}</div>`;
    }
</script>
</body>
</html>
