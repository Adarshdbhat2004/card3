<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4 Player Team Card Game</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    padding:0;
    background:#1a252f;
    color:white;
    font-family:Arial;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:10px;
}

.panel{
    background:#34495e;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:bold;
}

#createBtn{
    background:#2ecc71;
    color:white;
}

.card{
    width:85px;
    height:125px;
    background:white;
    border-radius:10px;
    padding:8px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
}

.red{
    color:#e74c3c;
}

.black{
    color:#2c3e50;
}

.disabled{
    opacity:.4;
    pointer-events:none;
}

.hand{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

#table{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.playerBox{
    background:#2c3e50;
    padding:10px;
    border-radius:10px;
    text-align:center;
}

.slot{
    width:90px;
    height:130px;
    border:2px dashed rgba(255,255,255,.3);
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
}

#status{
    color:#f1c40f;
    font-weight:bold;
    text-align:center;
}

.scoreBoard{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
}

.copyBox{
    background:#2c3e50;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    word-break:break-all;
}

</style>
</head>

<body>

<div class="container">

<div class="panel">

<h1>4 Player Team Card Game</h1>

<button id="createBtn">
CREATE ROOM
</button>

<br><br>

<div id="links"></div>

</div>

<div class="panel">

<div class="scoreBoard">

<div>
TEAM A (P1 & P3):
<span id="scoreA">0</span>
</div>

<div>
TRUMP:
<span id="trump">?</span>
</div>

<div>
TEAM B (P2 & P4):
<span id="scoreB">0</span>
</div>

</div>

<hr>

<div id="status">
Waiting...
</div>

</div>

<div id="table">

<div class="playerBox">
<h3>Player 2</h3>
<div class="slot" id="P2slot"></div>
</div>

<div class="playerBox">
<h3>Player 3</h3>
<div class="slot" id="P3slot"></div>
</div>

<div class="playerBox">
<h3>Player 1</h3>
<div class="slot" id="P1slot"></div>
</div>

<div class="playerBox">
<h3>Player 4</h3>
<div class="slot" id="P4slot"></div>
</div>

</div>

<div class="panel">

<h2>Your Cards</h2>

<div class="hand" id="myHand"></div>

</div>

</div>

<script>

/* ==========================
SUPABASE
========================== */

const SUPABASE_URL =
"https://pftbngrjxxkasossvhwm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* ==========================
GAME VARIABLES
========================== */

const suits = ['♠','♣','♥','♦'];

const values = [
'7','8','9','10','J','Q','K','A'
];

const power = {
'7':7,
'8':8,
'9':9,
'10':10,
'J':11,
'Q':12,
'K':13,
'A':14
};

const order = [
'P1',
'P2',
'P3',
'P4'
];

let room =
new URLSearchParams(location.search)
.get("room");

let myPlayer =
new URLSearchParams(location.search)
.get("player");

let channel;

let myHand = [];

let trumpSuit = '?';

let currentTurn = 'P1';

let scores = {
A:0,
B:0
};

let tableCards = {
P1:null,
P2:null,
P3:null,
P4:null
};

/* ==========================
START
========================== */

window.onload = ()=>{

document.getElementById("createBtn")
.onclick = createRoom;

if(room && myPlayer){

connectRoom();

}

};

/* ==========================
CREATE ROOM
========================== */

function createRoom(){

room =
Math.random()
.toString(36)
.substring(2,8);

myPlayer = 'P1';

const base =
location.origin +
location.pathname;

const p1 =
`${base}?room=${room}&player=P1`;

const p2 =
`${base}?room=${room}&player=P2`;

const p3 =
`${base}?room=${room}&player=P3`;

const p4 =
`${base}?room=${room}&player=P4`;

document.getElementById("links")
.innerHTML = `

<div class="copyBox">
<b>PLAYER 1</b><br>
${p1}
</div>

<div class="copyBox">
<b>PLAYER 2</b><br>
${p2}
</div>

<div class="copyBox">
<b>PLAYER 3</b><br>
${p3}
</div>

<div class="copyBox">
<b>PLAYER 4</b><br>
${p4}
</div>

`;

connectRoom();

}

/* ==========================
CONNECT ROOM
========================== */

function connectRoom(){

channel =
supabase.channel(
'room-'+room,
{
config:{
broadcast:{
self:true
}
}
}
);

channel

.on(
'broadcast',
{event:'start-game'},
({payload})=>{

myHand =
payload.hands[myPlayer];

trumpSuit =
payload.trump;

document.getElementById("trump")
.innerText =
trumpSuit;

renderHand();

updateStatus(
currentTurn===myPlayer
? "Your Turn"
: "Waiting..."
);

}
)

.on(
'broadcast',
{event:'play-card'},
({payload})=>{

tableCards[
payload.player
] = payload.card;

renderTable();

nextTurn();

if(allPlayed()){

setTimeout(()=>{

evaluateRound();

},1200);

}

}
)

.subscribe((status)=>{

if(status === 'SUBSCRIBED'){

updateStatus(
'Connected as '+myPlayer
);

if(myPlayer === 'P1'){

setTimeout(()=>{

startGame();

},1500);

}

}

});

}

/* ==========================
START GAME
========================== */

function startGame(){

let deck = [];

suits.forEach(s=>{

values.forEach(v=>{

deck.push({

value:v,
suit:s,

color:
(s==='♥'||s==='♦')
? 'red'
: 'black'

});

});

});

deck.sort(()=>Math.random()-0.5);

const hands = {

P1:deck.splice(0,8),
P2:deck.splice(0,8),
P3:deck.splice(0,8),
P4:deck.splice(0,8)

};

trumpSuit =
suits[
Math.floor(Math.random()*4)
];

channel.send({

type:'broadcast',

event:'start-game',

payload:{

hands:hands,
trump:trumpSuit

}

});

myHand =
hands.P1;

document.getElementById("trump")
.innerText =
trumpSuit;

renderHand();

}

/* ==========================
PLAY CARD
========================== */

function playCard(index){

if(currentTurn !== myPlayer){
return;
}

const card =
myHand[index];

myHand.splice(index,1);

tableCards[myPlayer] =
card;

renderHand();

renderTable();

channel.send({

type:'broadcast',

event:'play-card',

payload:{

player:myPlayer,
card:card

}

});

}

/* ==========================
NEXT TURN
========================== */

function nextTurn(){

let i =
order.indexOf(currentTurn);

i++;

if(i>=4){
i=0;
}

currentTurn =
order[i];

updateStatus(

currentTurn===myPlayer
? "Your Turn"
: "Waiting..."

);

}

/* ==========================
ALL PLAYED
========================== */

function allPlayed(){

return(

tableCards.P1 &&
tableCards.P2 &&
tableCards.P3 &&
tableCards.P4

);

}

/* ==========================
EVALUATE ROUND
========================== */

function evaluateRound(){

let winner = 'P1';

order.forEach(player=>{

const c =
tableCards[player];

const w =
tableCards[winner];

if(
c.suit===w.suit &&
power[c.value]>
power[w.value]
){
winner = player;
}

if(
c.suit===trumpSuit &&
w.suit!==trumpSuit
){
winner = player;
}

});

if(
winner==='P1' ||
winner==='P3'
){
scores.A++;
}else{
scores.B++;
}

document.getElementById("scoreA")
.innerText =
scores.A;

document.getElementById("scoreB")
.innerText =
scores.B;

tableCards = {

P1:null,
P2:null,
P3:null,
P4:null

};

renderTable();

currentTurn =
winner;

if(myHand.length===0){

let result = "DRAW";

if(scores.A>scores.B){
result="TEAM A WON";
}

if(scores.B>scores.A){
result="TEAM B WON";
}

alert(result);

updateStatus(result);

}else{

updateStatus(
winner+" won round"
);

}

}

/* ==========================
RENDER HAND
========================== */

function renderHand(){

const hand =
document.getElementById("myHand");

hand.innerHTML = '';

myHand.forEach((card,index)=>{

const div =
document.createElement("div");

div.className =
'card '+card.color;

if(currentTurn!==myPlayer){
div.classList.add("disabled");
}

div.innerHTML = `

<div>${card.value}</div>

<div style="
font-size:30px;
text-align:center;
">
${card.suit}
</div>

<div style="
transform:rotate(180deg);
">
${card.value}
</div>

`;

div.onclick =
()=>playCard(index);

hand.appendChild(div);

});

}

/* ==========================
RENDER TABLE
========================== */

function renderTable(){

order.forEach(player=>{

const slot =
document.getElementById(
player+'slot'
);

slot.innerHTML='';

const card =
tableCards[player];

if(card){

const div =
document.createElement("div");

div.className =
'card '+card.color;

div.innerHTML = `

<div>${card.value}</div>

<div style="
font-size:30px;
text-align:center;
">
${card.suit}
</div>

<div style="
transform:rotate(180deg);
">
${card.value}
</div>

`;

slot.appendChild(div);

}

});

}

/* ==========================
STATUS
========================== */

function updateStatus(text){

document.getElementById("status")
.innerText = text;

}

</script>

</body>
</html>
