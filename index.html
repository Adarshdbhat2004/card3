<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Card Game - Online Lobby</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a252f; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .card-box { background: #2c3e50; padding: 30px; border-radius: 15px; display: inline-block; min-width: 300px; }
        .btn { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .input { width: 90%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; }
        .share-link { background: #16a085; padding: 10px; margin-top: 20px; font-size: 12px; word-break: break-all; border-radius: 5px; cursor: pointer; }
        .player-tag { background: #34495e; padding: 5px; margin: 5px; border-radius: 5px; display: inline-block; border: 1px solid #3498db; }
    </style>
</head>
<body>

    <div class="card-box">
        <h2 id="title">Initializing...</h2>
        <div id="lobby-ui" style="display: none;">
            <input type="text" id="username" class="input" placeholder="Enter Your Name">
            <button class="btn" onclick="joinRoom()">Join Game</button>
            
            <div id="share-section" style="display: none;">
                <p>Share this link with 3 friends:</p>
                <div class="share-link" id="link-box" onclick="copyLink()">Click to Copy Link</div>
            </div>

            <div id="player-list-section" style="margin-top: 20px;">
                <h4>Players Joined (Wait for 4):</h4>
                <div id="player-display"></div>
            </div>
        </div>
    </div>

<script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let roomID = new URLSearchParams(window.location.search).get('room');
    let myName = "";

    // 1. Initial Load: Check if we need to generate a link
    async function init() {
        if (!roomID) {
            // Generate a random ID
            roomID = "GAME-" + Math.random().toString(36).substring(2, 7).toUpperCase();
            // Update URL without refreshing
            const newURL = window.location.origin + window.location.pathname + '?room=' + roomID;
            window.history.pushState({ path: newURL }, '', newURL);
            
            document.getElementById('title').innerText = "Create New Game";
        } else {
            document.getElementById('title').innerText = "Joining Game Room";
        }
        
        document.getElementById('lobby-ui').style.display = "block";
        document.getElementById('link-box').innerText = window.location.href;
        document.getElementById('share-section').style.display = "block";

        // Start listening for other players
        listenForChanges();
    }

    // 2. Join the Database
    async function joinRoom() {
        myName = document.getElementById('username').value;
        if (!myName) return alert("Please enter a name");

        // Get existing players
        const { data: room } = await supabase.from('rooms').select('players').eq('id', roomID).single();
        
        let currentPlayers = room ? room.players : [];

        if (currentPlayers.length >= 4) return alert("Room is full!");
        if (currentPlayers.includes(myName)) return alert("Name already joined!");

        currentPlayers.push(myName);

        if (!room) {
            // Room doesn't exist in DB yet, create it
            await supabase.from('rooms').insert([{ id: roomID, players: currentPlayers }]);
        } else {
            // Room exists, add my name
            await supabase.from('rooms').update({ players: currentPlayers }).eq('id', roomID);
        }

        document.getElementById('username').disabled = true;
        alert("You are in! Wait for others to join.");
    }

    // 3. Realtime Listener
    function listenForChanges() {
        supabase
            .channel('room_updates')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomID}` }, payload => {
                renderPlayers(payload.new.players);
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rooms', filter: `id=eq.${roomID}` }, payload => {
                renderPlayers(payload.new.players);
            })
            .subscribe();
            
        // Initial check
        refreshPlayerList();
    }

    async function refreshPlayerList() {
        const { data } = await supabase.from('rooms').select('players').eq('id', roomID).single();
        if (data) renderPlayers(data.players);
    }

    function renderPlayers(list) {
        const display = document.getElementById('player-display');
        display.innerHTML = "";
        list.forEach(p => {
            display.innerHTML += `<div class="player-tag">${p}</div>`;
        });

        if (list.length === 4) {
            document.body.innerHTML = `<h1>🎮 ALL PLAYERS JOINED!</h1><p>Starting Voice & Card Table...</p>`;
            // Here you would trigger the start of your card game code
        }
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied! Send it to your teammates.");
    }

    init();
</script>
</body>
</html>
