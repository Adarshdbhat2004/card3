<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Player Team Cards (Voice + Realtime)</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #1a252f; --panel: #34495e; --accent: #f1c40f; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; }
        
        /* 4-Player Table Layout */
        #game-table {
            display: grid;
            grid-template-areas: 
                ". top ."
                "left . right"
                ". bottom .";
            gap: 10px;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            position: relative;
        }
        .slot { width: 70px; height: 100px; border: 2px dashed #7f8c8d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .p1-slot { grid-area: bottom; border-color: var(--accent); }
        .p2-slot { grid-area: left; }
        .p3-slot { grid-area: top; border-color: var(--accent); } /* Partner */
        .p4-slot { grid-area: right; }

        .card { width: 60px; height: 90px; background: white; color: black; border-radius: 5px; font-weight: bold; padding: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .red { color: #e74c3c; }

        .controls { text-align: center; padding: 20px; }
        .hand { display: flex; overflow-x: auto; gap: 5px; padding: 10px; background: rgba(0,0,0,0.3); position: fixed; bottom: 0; width: 100%; }
        
        #setup-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #3498db; color: white; }
    </style>
</head>
<body>

<div id="setup-screen">
    <h1>4-Player Card Room</h1>
    <p id="room-status">Initializing...</p>
    <button id="join-btn" class="btn" style="display:none;" onclick="startJoining()">Join as Player <span id="player-num-label">?</span></button>
</div>

<div class="controls">
    <div style="display:flex; justify-content: space-around; font-weight: bold; color: var(--accent);">
        <div>Team 1 (P1+P3): <span id="score-t1">0</span></div>
        <div>Team 2 (P2+P4): <span id="score-t2">0</span></div>
    </div>
    <div id="status-msg">Waiting for players...</div>
</div>

<div id="game-table">
    <div class="slot p3-slot" id="slot-P3">P3</div>
    <div class="slot p2-slot" id="slot-P2">P2</div>
    <div class="slot p4-slot" id="slot-P4">P4</div>
    <div class="slot p1-slot" id="slot-P1">P1</div>
</div>

<div class="hand" id="my-hand"></div>

<script>
const SUPABASE_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
const SUPABASE_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let roomID = new URLSearchParams(window.location.search).get('room');
let myRole = ''; 
let channel;
let playersInRoom = [];

// 1. Assign Roles based on current presence
async function initLobby() {
    if (!roomID) {
        roomID = Math.random().toString(36).substring(7);
        window.history.pushState({}, '', `?room=${roomID}`);
    }

    channel = supabase.channel(`room-${roomID}`, {
        config: { presence: { key: 'user' } }
    });

    channel
    .on('presence', { event: 'sync' }, () => {
        const state = channel.presenceState();
        playersInRoom = Object.values(state).flat();
        
        if (!myRole) {
            myRole = `P${playersInRoom.length + 1}`;
            document.getElementById('player-num-label').innerText = playersInRoom.length + 1;
            document.getElementById('join-btn').style.display = 'block';
        }
        
        updateStatus(`Players in room: ${playersInRoom.length}/4`);
    })
    .on('broadcast', { event: 'card-played' }, ({ payload }) => {
        showCardOnTable(payload.role, payload.card);
    })
    .subscribe();
}

function startJoining() {
    channel.track({ role: myRole, joined_at: new Date().toISOString() });
    document.getElementById('setup-screen').style.display = 'none';
    initVoice();
    
    if (myRole === 'P1') {
        updateStatus("You are Host (P1). Wait for 4 players to deal.");
    }
}

// 2. Voice Mesh (Calls all lower-indexed players)
async function initVoice() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const peer = new Peer(`${roomID}-${myRole}`);

    peer.on('call', (call) => {
        call.answer(stream);
        call.on('stream', (remoteStream) => playAudio(remoteStream));
    });

    // Call everyone who joined before you
    playersInRoom.forEach(p => {
        if (p.role !== myRole) {
            const call = peer.call(`${roomID}-${p.role}`, stream);
            call.on('stream', (remoteStream) => playAudio(remoteStream));
        }
    });
}

function playAudio(stream) {
    const audio = document.createElement('audio');
    audio.srcObject = stream;
    audio.autoplay = true;
    document.body.appendChild(audio);
}

// 3. Game Logic
function playCard(card) {
    channel.send({
        type: 'broadcast',
        event: 'card-played',
        payload: { role: myRole, card: card }
    });
    showCardOnTable(myRole, card);
}

function showCardOnTable(role, card) {
    const slot = document.getElementById(`slot-${role}`);
    slot.innerHTML = `<div class="card ${card.color}">${card.val}${card.suit}</div>`;
}

function updateStatus(msg) {
    document.getElementById('status-msg').innerText = msg;
    document.getElementById('room-status').innerText = msg;
}

initLobby();
</script>
</body>
</html>
