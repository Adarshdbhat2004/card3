<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Player Team Card Game</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    padding:0;
    background:#1a252f;
    color:white;
    font-family:Arial;
}

#setup{
    position:fixed;
    inset:0;
    background:#1a252f;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
    z-index:100;
}

button{
    padding:14px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

#createBtn{
    background:#2ecc71;
    color:white;
}

#copyBtn{
    background:#3498db;
    color:white;
}

#main{
    max-width:1100px;
    margin:auto;
    padding:10px;
}

.panel{
    background:#34495e;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

#roomLink{
    width:320px;
    max-width:90%;
    padding:12px;
    border-radius:10px;
    border:none;
}

.score{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
}

#status{
    text-align:center;
    color:#f1c40f;
    font-weight:bold;
}

#table{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.slotBox{
    background:#2c3e50;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.slot{
    width:90px;
    height:130px;
    border:2px dashed rgba(255,255,255,.3);
    margin:auto;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hand{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

.card{
    width:85px;
    height:125px;
    background:white;
    border-radius:10px;
    padding:8px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.red{
    color:#e74c3c;
}

.black{
    color:#2c3e50;
}

.disabled{
    opacity:.4;
    pointer-events:none;
}

#trumpBox{
    background:#f1c40f;
    color:black;
    padding:5px 12px;
    border-radius:20px;
}

</style>
</head>

<body>

<div id="setup">

    <h1>4 Player Team Card Game</h1>

    <button id="createBtn">
        CREATE ROOM
    </button>

    <div id="shareBox" style="display:none;">

        <input type="text" id="roomLink" readonly>

        <br><br>

        <button id="copyBtn">
            COPY LINK
        </button>

        <p>
            Send these links:
        </p>

        <div id="playerLinks"></div>

    </div>

</div>

<div id="main">

<div class="panel">

<div class="score">

<div>
TEAM A (1 & 3):
<span id="scoreA">0</span>
</div>

<div id="trumpBox">
Trump:
<span id="trumpSuit">?</span>
</div>

<div>
TEAM B (2 & 4):
<span id="scoreB">0</span>
</div>

</div>

<hr>

<div id="status">
Waiting...
</div>

</div>

<div id="table">

<div class="slotBox">
<h3>Player 2</h3>
<div class="slot" id="P2slot"></div>
</div>

<div class="slotBox">
<h3>Player 3</h3>
<div class="slot" id="P3slot"></div>
</div>

<div class="slotBox">
<h3>Player 1</h3>
<div class="slot" id="P1slot"></div>
</div>

<div class="slotBox">
<h3>Player 4</h3>
<div class="slot" id="P4slot"></div>
</div>

</div>

<div class="panel">

<h2>Your Cards</h2>

<div class="hand" id="myHand"></div>

</div>

</div>

<script>

/* ===========================
SUPABASE
=========================== */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* ===========================
GAME VARIABLES
=========================== */

const suits = ['♠','♣','♥','♦'];
const values = ['7','8','9','10','J','Q','K','A'];

const power = {
    '7':7,
    '8':8,
    '9':9,
    '10':10,
    'J':11,
    'Q':12,
    'K':13,
    'A':14
};

let roomID =
new URLSearchParams(location.search).get("room");

let myPlayer =
new URLSearchParams(location.search).get("player");

let channel = null;

let myHand = [];

let currentTurn = "P1";

let trumpSuit = null;

let scores = {
    A:0,
    B:0
};

let tableCards = {
    P1:null,
    P2:null,
    P3:null,
    P4:null
};

const playerOrder = [
    'P1',
    'P2',
    'P3',
    'P4'
];

/* ===========================
START
=========================== */

window.onload = ()=>{

    document.getElementById("createBtn")
    .onclick=createRoom;

    document.getElementById("copyBtn")
    .onclick=copyLink;

    if(roomID && myPlayer){

        connectRealtime();

    }

};

/* ===========================
CREATE ROOM
=========================== */

function createRoom(){

    roomID =
    Math.random().toString(36)
    .substring(2,8);

    myPlayer = "P1";

    const base =
    location.origin +
    location.pathname;

    const p1 =
    `${base}?room=${roomID}&player=P1`;

    const p2 =
    `${base}?room=${roomID}&player=P2`;

    const p3 =
    `${base}?room=${roomID}&player=P3`;

    const p4 =
    `${base}?room=${roomID}&player=P4`;

    document.getElementById("roomLink")
    .value = p1;

    document.getElementById("shareBox")
    .style.display="block";

    document.getElementById("playerLinks")
    .innerHTML = `
    <p>Player 1:<br>${p1}</p>
    <p>Player 2:<br>${p2}</p>
    <p>Player 3:<br>${p3}</p>
    <p>Player 4:<br>${p4}</p>
    `;

    connectRealtime();
}

/* ===========================
COPY
=========================== */

function copyLink(){

    const text =
    document.getElementById("playerLinks")
    .innerText;

    navigator.clipboard.writeText(text);

    alert("Player links copied!");
}

/* ===========================
CONNECT REALTIME
=========================== */

function connectRealtime(){

    document.getElementById("setup")
    .style.display="none";

    channel =
    supabase.channel(
        "room-"+roomID
    );

    channel

    .on(
        'broadcast',
        {event:'start-game'},
        ({payload})=>{

            myHand =
            payload.hands[myPlayer];

            trumpSuit =
            payload.trump;

            document.getElementById("trumpSuit")
            .innerText = trumpSuit;

            renderHand();

            updateStatus(
                currentTurn===myPlayer
                ? "Your Turn"
                : "Waiting..."
            );

        }
    )

    .on(
        'broadcast',
        {event:'play-card'},
        ({payload})=>{

            tableCards[
                payload.player
            ] = payload.card;

            renderTable();

            nextTurn();

            if(allPlayed()){

                setTimeout(()=>{
                    checkWinner();
                },1200);

            }

        }
    )

    .subscribe((status)=>{

        if(status==="SUBSCRIBED"){

            updateStatus(
                "Connected as "+myPlayer
            );

            if(myPlayer==="P1"){

                setTimeout(()=>{
                    startGame();
                },1000);

            }

        }

    });

}

/* ===========================
START GAME
=========================== */

function startGame(){

    let deck = [];

    suits.forEach(s=>{

        values.forEach(v=>{

            deck.push({

                value:v,
                suit:s,
                color:
                (s==='♥'||s==='♦')
                ? 'red'
                : 'black'

            });

        });

    });

    deck.sort(()=>Math.random()-0.5);

    const hands = {

        P1:deck.splice(0,8),
        P2:deck.splice(0,8),
        P3:deck.splice(0,8),
        P4:deck.splice(0,8)

    };

    trumpSuit =
    suits[
        Math.floor(
            Math.random()*4
        )
    ];

    channel.send({

        type:'broadcast',

        event:'start-game',

        payload:{

            hands:hands,
            trump:trumpSuit

        }

    });

    myHand = hands.P1;

    document.getElementById("trumpSuit")
    .innerText = trumpSuit;

    renderHand();

}

/* ===========================
PLAY CARD
=========================== */

function playCard(index){

    if(currentTurn!==myPlayer){
        return;
    }

    const card =
    myHand[index];

    myHand.splice(index,1);

    tableCards[myPlayer] = card;

    renderHand();

    renderTable();

    channel.send({

        type:'broadcast',

        event:'play-card',

        payload:{
            player:myPlayer,
            card:card
        }

    });

}

/* ===========================
NEXT TURN
=========================== */

function nextTurn(){

    let index =
    playerOrder.indexOf(currentTurn);

    index++;

    if(index>=4){
        index=0;
    }

    currentTurn =
    playerOrder[index];

    updateStatus(

        currentTurn===myPlayer
        ? "Your Turn"
        : "Waiting..."

    );

    renderHand();

}

/* ===========================
CHECK WINNER
=========================== */

function checkWinner(){

    let winner = 'P1';

    playerOrder.forEach(player=>{

        const c =
        tableCards[player];

        const w =
        tableCards[winner];

        if(
            c.suit===w.suit &&
            power[c.value]>
            power[w.value]
        ){
            winner=player;
        }

        if(
            c.suit===trumpSuit &&
            w.suit!==trumpSuit
        ){
            winner=player;
        }

    });

    if(
        winner==="P1" ||
        winner==="P3"
    ){
        scores.A++;
    }else{
        scores.B++;
    }

    document.getElementById("scoreA")
    .innerText = scores.A;

    document.getElementById("scoreB")
    .innerText = scores.B;

    tableCards = {
        P1:null,
        P2:null,
        P3:null,
        P4:null
    };

    renderTable();

    currentTurn = winner;

    updateStatus(
        winner + " won the round"
    );

    if(myHand.length===0){

        let result="DRAW";

        if(scores.A>scores.B){
            result="TEAM A WON";
        }

        if(scores.B>scores.A){
            result="TEAM B WON";
        }

        alert(result);

        updateStatus(result);

    }

}

/* ===========================
ALL PLAYED
=========================== */

function allPlayed(){

    return (
        tableCards.P1 &&
        tableCards.P2 &&
        tableCards.P3 &&
        tableCards.P4
    );

}

/* ===========================
RENDER HAND
=========================== */

function renderHand(){

    const hand =
    document.getElementById("myHand");

    hand.innerHTML = "";

    myHand.forEach((card,index)=>{

        const div =
        document.createElement("div");

        div.className =
        "card " + card.color;

        if(currentTurn!==myPlayer){
            div.classList.add("disabled");
        }

        div.innerHTML = `
        <div>${card.value}</div>

        <div style="
        text-align:center;
        font-size:30px;
        ">
        ${card.suit}
        </div>

        <div style="
        transform:rotate(180deg);
        ">
        ${card.value}
        </div>
        `;

        div.onclick=()=>playCard(index);

        hand.appendChild(div);

    });

}

/* ===========================
RENDER TABLE
=========================== */

function renderTable(){

    ['P1','P2','P3','P4']
    .forEach(player=>{

        const slot =
        document.getElementById(
            player+'slot'
        );

        slot.innerHTML='';

        const card =
        tableCards[player];

        if(card){

            const div =
            document.createElement("div");

            div.className =
            "card " + card.color;

            div.innerHTML = `
            <div>${card.value}</div>

            <div style="
            text-align:center;
            font-size:30px;
            ">
            ${card.suit}
            </div>

            <div style="
            transform:rotate(180deg);
            ">
            ${card.value}
            </div>
            `;

            slot.appendChild(div);

        }

    });

}

/* ===========================
STATUS
=========================== */

function updateStatus(text){

    document.getElementById("status")
    .innerText = text;

}

</script>

</body>
</html>
