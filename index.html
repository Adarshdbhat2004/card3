<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Team Cards + Voice (Supabase)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #3498db; --dark: #1a252f; --light: #ecf0f1; }
        body { background: var(--dark); color: var(--light); font-family: sans-serif; margin: 0; padding: 10px; }
        
        /* Join Screen */
        #join-screen { position: fixed; inset: 0; background: var(--dark); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-box { padding: 15px; border-radius: 8px; border: none; width: 250px; margin-bottom: 10px; font-size: 16px; }
        
        /* Layout */
        .header { background: #2c3e50; padding: 15px; display: flex; justify-content: space-between; border-radius: 8px; }
        .game-area { display: flex; gap: 20px; margin-top: 20px; }
        .table { flex: 1; height: 500px; background: #1e2b37; border: 4px solid #34495e; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
        
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .card { background: white; color: black; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; display: inline-block; }
        .red { color: #e74c3c; }
        
        #my-hand { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="join-screen">
        <h2>Online Team Card Game</h2>
        <input type="text" id="username" class="input-box" placeholder="Your Name">
        <button class="btn" onclick="joinGame()">Enter Game Room</button>
        <p style="font-size: 12px; margin-top: 20px;">Link a friend to play together!</p>
    </div>

    <div class="header">
        <div id="room-info">Room ID: Loading...</div>
        <div id="turn-info">Waiting for players...</div>
        <button class="btn" onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied!')">Copy Invite Link</button>
    </div>

    <div class="game-area">
        <div class="table" id="table">
            <div id="table-cards"></div>
        </div>
        
        <div style="width: 200px; background: #2c3e50; padding: 15px; border-radius: 8px;">
            <h3>Voice Call</h3>
            <div id="voice-status">Connecting Mic...</div>
        </div>
    </div>

    <div id="my-hand"></div>

<script>
    // 1. INITIALIZE SUPABASE
    const SUPABASE_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";
    const supabase = document.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myName = "";
    let roomID = new URLSearchParams(window.location.search).get('room') || "lobby";
    let mySeat = ""; // A, B, C, or D

    // 2. JOIN LOGIC
    async function joinGame() {
        myName = document.getElementById('username').value;
        if(!myName) return;
        document.getElementById('join-screen').style.display = 'none';
        document.getElementById('room-info').innerText = `Room: ${roomID} | User: ${myName}`;

        initRealtime();
        initVoice();
    }

    // 3. REALTIME SYNC (The "Engine")
    function initRealtime() {
        const channel = supabase.channel(`room_${roomID}`)
        .on('broadcast', { event: 'card_played' }, (payload) => {
            renderTableCard(payload.payload);
        })
        .on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            console.log("Players online:", state);
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await channel.track({ user: myName, online_at: new Date().toISOString() });
            }
        });

        window.gameChannel = channel;
    }

    // 4. VOICE CALL LOGIC (PeerJS)
    function initVoice() {
        const peer = new Peer(`${roomID}-${myName.replace(/\s+/g, '')}`);
        
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            document.getElementById('voice-status').innerText = "🎤 Mic Active";
            
            peer.on('call', call => {
                call.answer(stream);
                call.on('stream', userAudio => playStream(userAudio));
            });

            // Automatically call existing peers (simplified logic)
            // In a full version, you'd fetch peer IDs from Supabase Presence
        });
    }

    function playStream(stream) {
        const audio = document.createElement('audio');
        audio.srcObject = stream;
        audio.play();
    }

    // 5. GAME ACTIONS
    function playCard(card) {
        // Send move to all other players instantly
        window.gameChannel.send({
            type: 'broadcast',
            event: 'card_played',
            payload: { user: myName, card: card }
        });
        
        // Update my own UI
        renderTableCard({ user: myName, card: card });
    }

    function renderTableCard(data) {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerText = `${data.user}: ${data.card}`;
        document.getElementById('table-cards').appendChild(div);
    }

    // Auto-generate Room Link if none exists
    if (!window.location.search.includes('room=')) {
        const newRoom = Math.random().toString(36).substring(7);
        window.history.pushState({}, '', `?room=${newRoom}`);
        roomID = newRoom;
    }

</script>
</body>
</html>
