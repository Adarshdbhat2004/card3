<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer Card Game - Connection Hub</title>

    <!-- Supabase JS CDN Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #1a252f;
            --panel-color: #34495e;
            --accent-color: #f1c40f;
            --blue-btn: #3498db;
            --green-btn: #2ecc71;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color); color: white;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        #setup-screen {
            background: var(--panel-color);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 15px; padding: 30px; text-align: center; 
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 90%; max-width: 400px;
        }

        .btn {
            padding: 14px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 16px;
            text-transform: uppercase; letter-spacing: 0.5px;
            transition: transform 0.1s ease; width: 100%; box-sizing: border-box;
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: var(--green-btn); color: white; }
        .btn-blue { background: var(--blue-btn); color: white; }

        #room-url-input {
            width: 100%; padding: 12px; border-radius: 6px; 
            border: 2px solid var(--blue-btn); background: #2c3e50; 
            color: white; text-align: center; font-size: 14px; box-sizing: border-box;
        }

        #status-text { color: var(--accent-color); font-weight: bold; margin-top: 15px; font-size: 16px; }
        .player-badge { background: #2c3e50; padding: 5px 10px; border-radius: 4px; margin: 2px; display: inline-block; font-size: 12px;}
    </style>
</head>

<body>

<div id="setup-screen">
    <h1>Card Match Lobby</h1>
    <p style="color:#bdc3c7; margin:-5px 0 10px 0;">Create a game room or join via a shared link (Up to 5 players total).</p>
    
    <button id="btn-create-room" class="btn btn-green">Create Game Room</button>
    
    <div id="share-link-box" style="display:none; width: 100%;">
        <input type="text" id="room-url-input" readonly style="margin-bottom: 10px;">
        <button id="btn-copy-link" class="btn btn-blue">Copy Link & Send</button>
    </div>

    <p id="status-text">Initializing Server Core...</p>
    <div id="connected-players-list"></div>
</div>

<script>
/* =========================
   SUPABASE CONNECTION CORNER
========================= */
const SUPABASE_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
const SUPABASE_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   ROOM & LOBBY CONFIGURATION
========================= */
let roomID = new URLSearchParams(window.location.search).get('room');
let myRole = ''; 
let channel = null;
let connectedPlayers = {};

window.addEventListener('DOMContentLoaded', () => {
    if (roomID) {
        // If a room parameter exists in the URL, this user is a joining player
        document.getElementById('btn-create-room').style.display = 'none';
        initRealtimeEngine();
    } else {
        // If no room parameter exists, this user is the Host (Player 1)
        document.getElementById('btn-create-room').addEventListener('click', generateRoom);
    }
    document.getElementById('btn-copy-link').addEventListener('click', copyRoomLink);
});

// Host generates a unique room ID
function generateRoom() {
    roomID = Math.random().toString(36).substring(2, 9);
    myRole = 'Player 1';
    
    const link = window.location.origin + window.location.pathname + '?room=' + roomID;
    document.getElementById('room-url-input').value = link;
    document.getElementById('share-link-box').style.display = 'block';
    document.getElementById('btn-create-room').style.display = 'none';
    
    initRealtimeEngine();
}

function copyRoomLink() {
    const input = document.getElementById('room-url-input');
    input.select();
    navigator.clipboard.writeText(input.value);
    alert("Match Room join link copied to clipboard! Share it with 4 friends.");
}

/* =========================
   SUPABASE REALTIME HUB
========================= */
function initRealtimeEngine() {
    channel = client.channel(`room-${roomID}`, {
        config: {
            presence: {
                key: myRole || 'Assigning...'
            }
        }
    });

    channel
    .on('presence', { event: 'sync' }, () => {
        const newState = channel.presenceState();
        updateLobbyList(newState);
    })
    .on('presence', { event: 'join' }, ({ key, currentPresences }) => {
        console.log(`${key} joined the lobby`);
    })
    .on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
        console.log(`${key} left the lobby`);
    })
    .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
            
            // If myRole wasn't designated as Host (Player 1), calculate user's sequence number dynamically
            if (!myRole) {
                const currentPresenceData = channel.presenceState();
                const count = Object.keys(currentPresenceData).length;
                
                // Block entry if there are already 5 players in the channel
                if (count >= 5) {
                    document.getElementById('status-text').innerText = "Room Full! Maximum 5 players reached.";
                    channel.unsubscribe();
                    return;
                }
                myRole = `Player ${count + 1}`;
            }

            document.getElementById('status-text').innerText = `Connected as ${myRole}!`;

            // Track this player's presence state across the shared Supabase channel
            await channel.track({
                user: myRole,
                joinedAt: new Date().toISOString()
            });
        }
    });
}

function updateLobbyList(presenceState) {
    const listContainer = document.getElementById('connected-players-list');
    listContainer.innerHTML = '';
    
    const activePlayers = Object.keys(presenceState);
    
    document.getElementById('status-text').innerText = `Lobby Active (${activePlayers.length}/5 Players)`;

    activePlayers.forEach(playerKey => {
        const badge = document.createElement('span');
        badge.className = 'player-badge';
        badge.innerText = playerKey;
        listContainer.appendChild(badge);
    });
}
</script>

</body>
</html>
