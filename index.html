<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Player Team Game - Online</title>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.0.js"></script>

    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #2ecc71;
            --danger: #e74c3c; --light: #ecf0f1; --dark: #1a252f;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark); color: var(--light); margin: 0; padding: 10px; overflow-x: hidden; }
        
        /* Lobby Styles */
        #lobby-screen {
            position: fixed; inset: 0; background: var(--dark); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Voice Status Bar */
        .voice-bar {
            background: #2c3e50; padding: 8px 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
            border: 1px solid var(--accent);
        }
        .mic-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; }
        .mic-active { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* Existing Game Styles Integration */
        .teams-banner { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; background: #2c3e50; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        .round-table-arena { 
            position: relative; width: 100%; max-width: 500px; height: 450px; 
            background: #1e2b37; border: 4px solid #34495e; border-radius: 50%; 
            margin: 20px auto; display: grid; 
            grid-template-areas: ". pA ." "pD pit pB" ". pC .";
            grid-template-rows: 120px 1fr 120px; grid-template-columns: 100px 1fr 100px;
            align-items: center; justify-items: center;
        }
        .player-spot { width: 100%; display: flex; flex-direction: column; align-items: center; }
        #spot-A { grid-area: pA; } #spot-B { grid-area: pB; } #spot-C { grid-area: pC; } #spot-D { grid-area: pD; }
        .table-center { grid-area: pit; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .card { background: white; color: black; border-radius: 4px; padding: 5px 8px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; font-size: 12px; }
        .card.red { color: var(--danger); }
        .card.hidden-card { background: #34495e; color: transparent; border: 1px solid #2c3e50; pointer-events: none; }
        .played-card-box { background: white; color: black; width: 40px; height: 60px; border-radius: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; position: relative; }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .player-label { font-size: 12px; background: #2c3e50; padding: 2px 8px; border-radius: 10px; margin-bottom: 5px; }
        .active .player-label { background: var(--accent); }
    </style>
</head>
<body>

<div id="lobby-screen">
    <h2 id="lobby-status">Initialize Game Room</h2>
    <div id="setup-controls">
        <button id="btn-create" class="btn" onclick="createOnlineRoom()">Create New Game</button>
    </div>
    <div id="share-area" style="display:none; margin-top: 20px; text-align: center;">
        <p>Invite Players (Need 4 total):</p>
        <input type="text" id="share-url" readonly style="padding:8px; width: 250px; background:#1a252f; color:white; border:1px solid #34495e;">
        <div id="player-check-list" style="margin-top: 15px;"></div>
        <button id="btn-start-game" class="btn" style="margin-top:20px; background:var(--success); display:none;" onclick="broadcastStart()">Start Match Now</button>
    </div>
</div>

<div class="container">
    <div class="voice-bar">
        <div id="mic-indicator" class="mic-dot"></div>
        <span id="voice-label" style="font-size: 12px;">Voice: Connecting...</span>
        <button id="btn-voice" class="btn" style="padding: 4px 10px; font-size: 11px;" onclick="toggleMic()">Mute Mic</button>
    </div>

    <div class="teams-banner">
        <div><small id="t1-n">Team 1</small><br><b id="t1-score">0</b></div>
        <div id="match-target" style="font-size: 12px; background: #1a252f; padding: 5px; border-radius: 4px;">Waiting...</div>
        <div><small id="t2-n">Team 2</small><br><b id="t2-score">0</b></div>
    </div>

    <div id="status-message" style="text-align:center; margin-bottom:10px; font-weight:bold; color:var(--accent);">Waiting for game to start...</div>

    <div id="action-area" style="text-align:center; min-height: 50px; margin-bottom: 10px;"></div>

    <div class="round-table-arena">
        <div class="player-spot" id="spot-A"><div class="player-label">P-A</div><div class="cards-row" id="cards-A"></div></div>
        <div class="player-spot" id="spot-B"><div class="player-label">P-B</div><div class="cards-row" id="cards-B"></div></div>
        <div class="player-spot" id="spot-C"><div class="player-label">P-C</div><div class="cards-row" id="cards-C"></div></div>
        <div class="player-spot" id="spot-D"><div class="player-label">P-D</div><div class="cards-row" id="cards-D"></div></div>
        <div class="table-center" id="table-pit"></div>
    </div>
</div>

<script>
/* ==========================================
   CONFIG & STATE
   ========================================== */
const SUITS = { 'S': '♠', 'C': '♣', 'H': '♥', 'D': '♦' };
const PLAYERS = ['A', 'B', 'C', 'D'];
const SUPABASE_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
const SUPABASE_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC"; // Using provided key
const AGORA_APP_ID = "YOUR_AGORA_APP_ID"; // Get a free ID from agora.io

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

let roomID = new URLSearchParams(window.location.search).get('room');
let myPlayerID = ''; // 'A', 'B', 'C' or 'D'
let gameChannel = null;
let localAudioTrack = null;
let isMuted = false;

// Game State
let gameState = {
    phase: 'LOBBY',
    currentTurn: 'A',
    hands: {},
    pit: [],
    tricksWon: { T1: 0, T2: 0 },
    trump: null,
    trumpRevealed: false,
    bidTarget: 0,
    bidder: null
};

/* ==========================================
   NETWORKING / LOBBY LOGIC
   ========================================== */
window.onload = () => {
    if (roomID) {
        joinRoom();
    }
};

function createOnlineRoom() {
    roomID = Math.random().toString(36).substring(2, 9);
    window.history.pushState({}, '', `?room=${roomID}`);
    joinRoom();
}

async function joinRoom() {
    document.getElementById('setup-controls').style.display = 'none';
    document.getElementById('share-area').style.display = 'block';
    document.getElementById('share-url').value = window.location.href;

    gameChannel = client.channel(`room-${roomID}`, {
        config: { presence: { key: roomID } }
    });

    gameChannel
        .on('presence', { event: 'sync' }, () => {
            const state = gameChannel.presenceState();
            updateLobbyUI(state);
        })
        .on('broadcast', { event: 'game-update' }, ({ payload }) => {
            gameState = payload;
            renderUI();
        })
        .on('broadcast', { event: 'start-match' }, () => {
            document.getElementById('lobby-screen').style.display = 'none';
            initVoice();
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                const presence = gameChannel.presenceState();
                const count = Object.keys(presence).length;
                myPlayerID = PLAYERS[count] || 'Viewer';
                document.getElementById('lobby-status').innerText = `You are Player ${myPlayerID}`;
                await gameChannel.track({ player: myPlayerID });
            }
        });
}

function updateLobbyUI(presence) {
    const list = document.getElementById('player-check-list');
    const users = Object.values(presence).flatMap(u => u);
    list.innerHTML = users.map(u => `<div>✅ Player ${u.player} is ready</div>`).join('');
    
    if (users.length >= 4 && myPlayerID === 'A') {
        document.getElementById('btn-start-game').style.display = 'inline-block';
    }
}

/* ==========================================
   VOICE CALLING (AGORA)
   ========================================== */
async function initVoice() {
    try {
        await agoraClient.join(AGORA_APP_ID, roomID, null, null);
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
        await agoraClient.publish([localAudioTrack]);
        
        document.getElementById('mic-indicator').classList.add('mic-active');
        document.getElementById('voice-label').innerText = "Voice: Connected";
        
        agoraClient.on("user-published", async (user, mediaType) => {
            await agoraClient.subscribe(user, mediaType);
            if (mediaType === "audio") user.audioTrack.play();
        });
    } catch (e) {
        console.error("Voice failed", e);
        document.getElementById('voice-label').innerText = "Voice: Failed";
    }
}

function toggleMic() {
    isMuted = !isMuted;
    localAudioTrack.setEnabled(!isMuted);
    document.getElementById('btn-voice').innerText = isMuted ? "Unmute Mic" : "Mute Mic";
    document.getElementById('mic-indicator').classList.toggle('mic-active', !isMuted);
}

/* ==========================================
   GAME ENGINE (CONVERTED FROM OFFLINE)
   ========================================== */
function broadcastStart() {
    // Only Player A initializes the deck to ensure everyone sees the same shuffle
    const deck = [];
    const suits = ['S', 'C', 'H', 'D'];
    const values = ['7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
    suits.forEach(s => values.forEach(v => deck.push({ suit: s, value: v })));
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }

    gameState = {
        phase: 'BID1',
        currentTurn: 'A',
        hands: {
            A: deck.slice(0, 8),
            B: deck.slice(8, 16),
            C: deck.slice(16, 24),
            D: deck.slice(24, 32)
        },
        pit: [],
        tricksWon: { T1: 0, T2: 0 },
        trump: null,
        trumpRevealed: false,
        bidTarget: 5,
        bidder: 'A'
    };

    gameChannel.send({ type: 'broadcast', event: 'start-match', payload: {} });
    syncGameState();
}

function syncGameState() {
    gameChannel.send({ type: 'broadcast', event: 'game-update', payload: gameState });
    renderUI();
}

function renderUI() {
    document.getElementById('t1-score').innerText = gameState.tricksWon.T1;
    document.getElementById('t2-score').innerText = gameState.tricksWon.T2;
    document.getElementById('status-message').innerText = `Turn: Player ${gameState.currentTurn}`;
    
    // Render Hands
    PLAYERS.forEach(p => {
        const row = document.getElementById(`cards-${p}`);
        row.innerHTML = '';
        document.getElementById(`spot-${p}`).classList.toggle('active', gameState.currentTurn === p);

        gameState.hands[p].forEach((card, idx) => {
            const btn = document.createElement('button');
            const isRed = card.suit === 'H' || card.suit === 'D';
            
            if (p === myPlayerID) {
                btn.className = `card ${isRed ? 'red' : ''}`;
                btn.innerText = `${card.value}${SUITS[card.suit]}`;
                btn.onclick = () => handlePlay(idx);
            } else {
                btn.className = `card hidden-card`;
                btn.innerText = `?`;
            }
            row.appendChild(btn);
        });
    });

    // Render Table Pit
    const pit = document.getElementById('table-pit');
    pit.innerHTML = gameState.pit.map(p => `
        <div class="played-card-box ${p.card.suit === 'H' || p.card.suit === 'D' ? 'red' : ''}">
            ${p.card.value}${SUITS[p.card.suit]}
            <div style="font-size:9px; position:absolute; bottom:-12px; color:white;">${p.player}</div>
        </div>
    `).join('');

    // Handle Bidding Phase Buttons
    const actions = document.getElementById('action-area');
    actions.innerHTML = '';
    if (gameState.phase === 'BID1' && myPlayerID === gameState.currentTurn) {
        actions.innerHTML = `
            <button class="btn" onclick="sendBid(5)">Bid 5</button>
            <button class="btn" onclick="sendBid(6)">Bid 6</button>
            <button class="btn" style="background:gray" onclick="sendBid(0)">Pass</button>
        `;
    }
}

function handlePlay(idx) {
    if (gameState.phase !== 'PLAY' || gameState.currentTurn !== myPlayerID) return;
    
    const card = gameState.hands[myPlayerID].splice(idx, 1)[0];
    gameState.pit.push({ player: myPlayerID, card: card });
    
    // Move to next player
    const curIdx = PLAYERS.indexOf(myPlayerID);
    gameState.currentTurn = PLAYERS[(curIdx + 1) % 4];

    // Evaluate Trick if 4 cards are down
    if (gameState.pit.length === 4) {
        setTimeout(evaluateTrick, 1000);
    }
    
    syncGameState();
}

function sendBid(val) {
    gameState.bidTarget = val;
    gameState.phase = 'PLAY'; // Simplified for this version
    gameState.currentTurn = 'A';
    syncGameState();
}

function evaluateTrick() {
    // Basic logic: high card of lead suit wins (Add trump logic based on your offline code)
    const winner = gameState.pit[0].player; 
    if (winner === 'A' || winner === 'C') gameState.tricksWon.T1++;
    else gameState.tricksWon.T2++;
    
    gameState.pit = [];
    gameState.currentTurn = winner;
    syncGameState();
}

</script>
</body>
</html>
