<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Card Game Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #3498db; --bg: #1a252f; --panel: #2c3e50; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        /* Lobby Screen */
        .box { background: var(--panel); padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; }
        .input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 85%; transition: 0.3s; }
        .btn:hover { background: #2980b9; }
        
        /* Game Hidden initially */
        #game-ui { display: none; width: 100%; height: 100%; flex-direction: column; padding: 20px; }
        .player-list { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .p-tag { background: #34495e; padding: 5px 15px; border-radius: 20px; font-size: 14px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="box">
            <h2 id="room-title">Create Game</h2>
            <p id="room-id-display" style="color: #bdc3c7;"></p>
            <input type="text" id="username" class="input" placeholder="Your Name...">
            <button class="btn" id="main-btn" onclick="handleJoin()">Start / Join Game</button>
            <div id="wait-msg" style="margin-top: 15px; font-size: 13px; display: none;">Waiting for teammates...</div>
        </div>
    </div>

    <div id="game-ui">
        <div class="player-list" id="player-tags"></div>
        <div style="text-align: center;">
            <div id="status-update">Room Connected! Voice is active.</div>
            <button class="btn" style="width: auto;" onclick="copyInvite()">Copy Invite Link</button>
        </div>
        </div>

<script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let roomID = new URLSearchParams(window.location.search).get('room');
    const lobby = document.getElementById('lobby');
    const title = document.getElementById('room-title');
    const roomIdDisp = document.getElementById('room-id-display');

    // 1. Setup Room ID
    if (roomID) {
        title.innerText = "Join Team Room";
        roomIdDisp.innerText = `Room: ${roomID}`;
    } else {
        roomID = "ROOM-" + Math.random().toString(36).substring(2, 7).toUpperCase();
        window.history.pushState({}, '', `?room=${roomID}`);
        roomIdDisp.innerText = `New Room: ${roomID}`;
    }

    // 2. Joining Logic
    async function handleJoin() {
        const name = document.getElementById('username').value;
        if (!name) return alert("Enter your name!");

        // Add player to Supabase table
        const { data: room } = await supabase.from('rooms').select('*').eq('id', roomID).single();

        let players = room ? room.players : [];
        
        if (players.length >= 4) return alert("Room is full!");
        if (players.includes(name)) return alert("Name already taken!");

        players.push(name);

        if (!room) {
            // Create the room
            await supabase.from('rooms').insert([{ id: roomID, players: players, game_state: {} }]);
        } else {
            // Update the room
            await supabase.from('rooms').update({ players: players }).eq('id', roomID);
        }

        document.getElementById('main-btn').style.display = "none";
        document.getElementById('wait-msg').style.display = "block";
        
        startRealtimeWatcher(name);
    }

    // 3. Realtime Watcher
    function startRealtimeWatcher(myName) {
        supabase
            .channel('room-updates')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomID}` }, payload => {
                updateLobby(payload.new.players, myName);
            })
            .subscribe();

        // Check current status immediately
        checkCurrentPlayers(myName);
    }

    async function checkCurrentPlayers(myName) {
        const { data } = await supabase.from('rooms').select('players').eq('id', roomID).single();
        if (data) updateLobby(data.players, myName);
    }

    function updateLobby(players, myName) {
        const tagContainer = document.getElementById('player-tags');
        tagContainer.innerHTML = "";
        players.forEach(p => {
            tagContainer.innerHTML += `<div class="p-tag">${p} ${p === myName ? '(You)' : ''}</div>`;
        });

        if (players.length === 4) {
            lobby.style.display = "none";
            document.getElementById('game-ui').style.display = "flex";
            initVoice(myName);
        }
    }

    function copyInvite() {
        navigator.clipboard.writeText(window.location.href);
        alert("Link Copied! Send to 3 friends.");
    }

    // 4. Voice Call (PeerJS)
    function initVoice(myName) {
        const peer = new Peer(`${roomID}-${myName.replace(/\s+/g, '')}`);
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            peer.on('call', call => {
                call.answer(stream);
                call.on('stream', remoteStream => {
                    const audio = document.createElement('audio');
                    audio.srcObject = remoteStream;
                    audio.play();
                });
            });
            // Logic to call others would be added here based on player list
        });
    }
</script>
</body>
</html>
