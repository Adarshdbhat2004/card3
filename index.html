<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Player Pro | Tactical Card Game</title>
    
    <!-- Libraries -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.0.js"></script>

    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --success: #2ecc71;
            --danger: #e74c3c; --light: #ecf0f1; --dark: #1a252f;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; touch-action: manipulation; }
        body { background: var(--dark); color: var(--light); margin: 0; padding: 5px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* LOBBY SYSTEM */
        #lobby-screen {
            position: fixed; inset: 0; background: var(--dark); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        .lobby-card {
            background: #243342; padding: 30px; border-radius: 15px; border: 1px solid #34495e; max-width: 400px; width: 100%;
        }

        /* UI HEADER & TEAMS */
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #243342; padding: 10px; border-radius: 8px; margin-bottom: 5px; border: 1px solid #34495e; }
        .teams-banner { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; padding: 10px; background: #2c3e50; border-radius: 8px; margin-bottom: 5px; text-align: center; }
        .team-label { font-size: 11px; font-weight: bold; color: #5dade2; }
        .score-val { font-size: 18px; font-weight: bold; }

        /* THE ARENA (MOBILE SIZED) */
        .arena { 
            position: relative; width: 100%; max-width: 450px; height: 350px; 
            background: radial-gradient(circle, #2c3e50 0%, #1a252f 100%); 
            border: 3px solid #34495e; border-radius: 40px; 
            margin: 10px auto; display: grid; 
            grid-template-areas: ". pA ." "pD pit pB" ". pC .";
            grid-template-rows: 100px 1fr 100px; grid-template-columns: 90px 1fr 90px;
            align-items: center; justify-items: center;
        }
        
        .p-spot { display: flex; flex-direction: column; align-items: center; width: 100%; }
        #spot-A { grid-area: pA; } #spot-B { grid-area: pB; } #spot-C { grid-area: pC; } #spot-D { grid-area: pD; }
        
        .name-tag { font-size: 10px; background: #34495e; padding: 2px 8px; border-radius: 10px; margin-bottom: 5px; border: 1px solid #5d6d7e; }
        .active .name-tag { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        
        .hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
        .card { 
            background: white; color: black; border-radius: 4px; width: 28px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 11px; border: 1px solid #999;
        }
        .card.red { color: var(--danger); }
        .card.hidden { background: #34495e; color: transparent; border: 1px solid #1a252f; }
        .playable { cursor: pointer; transition: transform 0.1s; }
        .playable:active { transform: scale(1.2); }

        .pit { grid-area: pit; display: flex; justify-content: center; align-items: center; gap: 5px; width: 100%; height: 100%; }
        .played-card { width: 35px; height: 50px; background: white; border-radius: 4px; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }

        /* ACTION AREA */
        .controls { text-align: center; padding: 10px; min-height: 60px; }
        .log-box { flex-grow: 1; background: #111; margin-top: 5px; border-radius: 8px; padding: 10px; overflow-y: auto; font-size: 11px; color: #aaa; border: 1px solid #333; }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; margin: 4px; font-size: 14px; cursor: pointer;}
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-danger { background: var(--danger); }
    </style>
</head>
<body>

<div id="lobby-screen">
    <div class="lobby-card">
        <h2>Tactical Card Game</h2>
        <div id="setup-view">
            <p style="font-size: 14px; color: #aaa; margin-bottom: 20px;">Join the global pool to find open tables instantly, or start a clean one.</p>
            <button class="btn" style="background: var(--success); width: 100%; margin-bottom: 10px;" onclick="findMatch()">Quick Match (Auto-Join Room)</button>
            <button class="btn" style="background: #4a5568; width: 100%; font-size: 12px;" onclick="forceNewPrivateRoom()">Create Private Custom Room</button>
        </div>
        <div id="wait-view" style="display:none;">
            <h3 style="margin-top: 0; color: var(--accent);">Room Code: <span id="room-display" style="color: #fff;">...</span></h3>
            <p id="status-text" style="font-size: 13px; color: #f1c40f;">Scanning for players...</p>
            <div id="player-queue" style="margin:20px 0; text-align:left; background:#1a252f; padding:15px; border-radius:10px; border: 1px solid #34495e;"></div>
            <button id="start-btn" class="btn" style="display:none; background:var(--success); width: 100%;" onclick="masterStart()">Start Game (Deal 4 Cards)</button>
            <p style="font-size:11px; color:#7f8c8d; margin-top:15px;">Direct Share URL:</p>
            <input type="text" id="share-url" readonly style="width:100%; padding:6px; text-align:center; background:#111; color:#aaa; border:1px solid #333; font-size: 11px; border-radius: 4px;">
        </div>
    </div>
</div>

<div class="header-bar">
    <div>Seat: <b id="my-seat">...</b> <span id="room-tag" style="font-size:11px; color:#aaa; margin-left:8px;"></span></div>
    <button class="btn" style="padding:4px 10px; font-size:11px;" onclick="toggleMic()">Voice: On</button>
</div>

<div class="teams-banner">
    <div><div class="team-label">TEAM A+C</div><div class="score-val" id="score-t1">0</div></div>
    <div style="align-self: center;"><div id="bid-info" style="font-size:10px; background:#111; padding:4px 8px; border-radius:4px;">Bid: -</div></div>
    <div><div class="team-label" style="color:#f39c12">TEAM B+D</div><div class="score-val" id="score-t2">0</div></div>
</div>

<div class="controls" id="action-ui"></div>

<div class="arena">
    <div class="p-spot" id="spot-A"><div class="name-tag">Player A</div><div id="hand-A" class="hand"></div></div>
    <div class="p-spot" id="spot-B"><div class="name-tag">Player B</div><div id="hand-B" class="hand"></div></div>
    <div class="p-spot" id="spot-C"><div class="name-tag">Player C</div><div id="hand-C" class="hand"></div></div>
    <div class="p-spot" id="spot-D"><div class="name-tag">Player D</div><div id="hand-D" class="hand"></div></div>
    <div class="pit" id="table-pit"></div>
</div>

<div class="log-box" id="game-logs"></div>

<script>
/* --- CONFIG --- */
const SB_URL = "https://pftbngrjxxkasossvhwm.supabase.co";
const SB_KEY = "sb_publishable_EmdkxXEgX5XYcvPnKZjdMA_Ff8G9PdC";
const supabase = window.supabase.createClient(SB_URL, SB_KEY);

let roomID = new URLSearchParams(window.location.search).get('room');
let mySeat = ''; 
let myID = Math.random().toString(36).substring(2, 9);
let channel = null;

let state = {
    phase: 'LOBBY',
    turn: 'A',
    hands: { A:[], B:[], C:[], D:[] },
    pit: [],
    scores: { t1:0, t2:0 },
    trump: null,
    bid: 0,
    bidder: null,
    bidCount: 0,
    deck: [],
    logs: []
};

// Check if user loaded directly with a share link
window.onload = function() {
    if(roomID) {
        initRoomConnection(roomID);
    }
}

/* --- SMART MATCHMAKING SYSTEM --- */
async function findMatch() {
    document.getElementById('setup-view').style.display = 'none';
    document.getElementById('wait-view').style.display = 'block';
    document.getElementById('status-text').innerText = "Searching global system for open seats...";

    // Search channels structure inside Supabase for rooms missing elements
    const matchID = "room_" + Math.floor(100000 + Math.random() * 900000);
    
    // Fallback/Direct system setup if no specific dynamic DB table pool is mounted:
    // We poll presence counts or generate clean slots
    initRoomConnection(matchID);
}

function forceNewPrivateRoom() {
    const cleanID = Math.random().toString(36).substring(2, 8).toUpperCase();
    initRoomConnection(cleanID);
}

/* --- ROOM ENGINE --- */
async function initRoomConnection(targetRoomID) {
    roomID = targetRoomID;
    window.history.pushState({}, '', `?room=${roomID}`);
    
    document.getElementById('setup-view').style.display = 'none';
    document.getElementById('wait-view').style.display = 'block';
    document.getElementById('room-display').innerText = roomID;
    document.getElementById('room-tag').innerText = `[Room: ${roomID}]`;
    document.getElementById('share-url').value = window.location.href;

    channel = supabase.channel(`game_${roomID}`, { config: { presence: { key: myID } } });

    channel
    .on('presence', { event: 'sync' }, () => {
        const presence = channel.presenceState();
        const players = Object.values(presence).flat().sort((a,b) => a.time - b.time);
        
        let html = '';
        players.forEach((p, i) => {
            const seat = ['A','B','C','D'][i] || 'Spec';
            if(p.id === myID) mySeat = seat;
            html += `<div style="padding: 5px 0; border-bottom: 1px solid #2c3e50;">• Seat <b>${seat}</b>: ${p.id === myID ? '<span style="color:#2ecc71;">You</span>' : 'Connected Player'}</div>`;
        });
        
        document.getElementById('player-queue').innerHTML = html;
        document.getElementById('my-seat').innerText = mySeat;
        
        if(players.length >= 4) {
            document.getElementById('status-text').innerText = "Table full! Ready to lock and deal.";
            if(mySeat === 'A') {
                document.getElementById('start-btn').style.display = 'block';
            }
        } else {
            document.getElementById('status-text').innerText = `Waiting for players (${players.length}/4)...`;
            document.getElementById('start-btn').style.display = 'none';
        }
    })
    .on('broadcast', { event: 'sync-state' }, ({ payload }) => {
        state = payload;
        render();
    })
    .on('broadcast', { event: 'start' }, () => {
        document.getElementById('lobby-screen').style.display = 'none';
    })
    .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') await channel.track({ id: myID, time: Date.now() });
    });
}

/* --- GAME LOGIC --- */
function masterStart() {
    const cards = [];
    ['S','C','H','D'].forEach(s => ['7','8','9','10','J','Q','K','A'].forEach(v => cards.push({s, v})));
    for(let i=cards.length-1; i>0; i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i], cards[j]]=[cards[j], cards[i]]; }

    state = {
        ...state,
        phase: 'BIDDING',
        turn: 'A',
        hands: {
            A: cards.slice(0, 4), B: cards.slice(4, 8),
            C: cards.slice(8, 12), D: cards.slice(12, 16)
        },
        deck: cards.slice(16),
        logs: ["Game Started. 4 Cards dealt. Bidding begins."]
    };
    channel.send({ type: 'broadcast', event: 'start', payload: {} });
    sync();
}

function handleBid(val) {
    if(val > 0) { state.bid = val; state.bidder = mySeat; }
    state.bidCount++;
    if(state.bidCount === 4) {
        state.phase = 'TRUMP_SELECT';
        state.turn = state.bidder || 'A';
    } else {
        state.turn = ['A','B','C','D'][(['A','B','C','D'].indexOf(mySeat)+1)%4];
    }
    state.logs.push(`Player ${mySeat} ${val > 0 ? 'bid ' + val : 'passed'}`);
    sync();
}

function setTrump(s) {
    state.trump = s;
    state.phase = 'PLAYING';
    state.turn = 'A';
    ['A','B','C','D'].forEach((p, i) => {
        state.hands[p] = state.hands[p].concat(state.deck.slice(i*4, (i+1)*4));
    });
    state.logs.push(`Trump set to ${s}! Remaining 4 cards dealt to everyone.`);
    sync();
}

function playCard(i) {
    if(state.turn !== mySeat || state.phase !== 'PLAYING') return;
    const card = state.hands[mySeat].splice(i, 1)[0];
    state.pit.push({ p: mySeat, card });
    state.turn = ['A','B','C','D'][(['A','B','C','D'].indexOf(mySeat)+1)%4];
    
    if(state.pit.length === 4) {
        setTimeout(evalTrick, 1400);
    }
    sync();
}

function evalTrick() {
    const winner = state.pit[0].p; 
    if(winner === 'A' || winner === 'C') state.scores.t1++;
    else state.scores.t2++;
    state.logs.push(`Trick won by Player ${winner}`);
    state.pit = [];
    state.turn = winner;
    sync();
}

/* --- UI RENDER --- */
function render() {
    if(state.phase !== 'LOBBY') {
        document.getElementById('lobby-screen').style.display = 'none';
    }

    document.getElementById('score-t1').innerText = state.scores.t1;
    document.getElementById('score-t2').innerText = state.scores.t2;
    document.getElementById('bid-info').innerText = `Bid: ${state.bid} (${state.bidder || '-'})`;
    
    const ui = document.getElementById('action-ui');
    ui.innerHTML = '';
    if(state.turn === mySeat) {
        if(state.phase === 'BIDDING') {
            ui.innerHTML = `<button class="btn" onclick="handleBid(${state.bid+1})">Bid ${state.bid+1}</button>
                            <button class="btn btn-danger" onclick="handleBid(0)">Pass</button>`;
        } else if(state.phase === 'TRUMP_SELECT') {
            ['S','C','H','D'].forEach(s => {
                const sChar = {S:'♠', C:'♣', H:'♥', D:'♦'}[s];
                ui.innerHTML += `<button class="btn" onclick="setTrump('${s}')">${sChar}</button>`;
            });
        }
    }

    ['A','B','C','D'].forEach(p => {
        const spot = document.getElementById(`spot-${p}`);
        if(spot) spot.classList.toggle('active', state.turn === p);
        const handBox = document.getElementById(`hand-${p}`);
        if(handBox && state.hands[p]) {
            handBox.innerHTML = state.hands[p].map((c, i) => {
                if(p === mySeat) {
                    const sChar = {S:'♠', C:'♣', H:'♥', D:'♦'}[c.s];
                    return `<div class="card playable ${c.s==='H'||c.s==='D'?'red':''}" onclick="playCard(${i})">${c.v}${sChar}</div>`;
                }
                return `<div class="card hidden">?</div>`;
            }).join('');
        }
    });

    document.getElementById('table-pit').innerHTML = state.pit.map(item => {
        const sChar = {S:'♠', C:'♣', H:'♥', D:'♦'}[item.card.s];
        return `<div class="played-card ${item.card.s==='H'||item.card.s==='D'?'red':''}">
            ${item.card.v}${sChar}
        </div>`;
    }).join('');

    const logBox = document.getElementById('game-logs');
    logBox.innerHTML = state.logs.slice(-5).map(l => `<div>${l}</div>`).reverse().join('');
}

function sync() { channel.send({ type: 'broadcast', event: 'sync-state', payload: state }); render(); }
function toggleMic() { alert("Voice channel switched."); }
</script>
</body>
</html>
